name: Publish sdist tarball to PyPi
 
on:
  push:
    tags:
        - "*"
 
jobs:
  build-n-publish:
    name: Build and publish on PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: 3.9
      - name: Build a source tarball
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
      - name: Build a source tarball
        run: |
          python -m build
      - name: Publish distribution package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          #password: ${{ secrets.PYPI_API_TOKEN }}
          verbose: true

  deploy_docker_image:
    env:
      REGISTRY_IMAGE_TAG: $GITHUB_REF_NAME
      CI_REGISTRY_IMAGE: bluebrain/bbp-atlas-pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@master

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ vars.BBPBUILDBOT_DOCKERHUB_USER }}
          password: ${{ secrets.BBPBUILDBOT_DOCKERHUB_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: "bluebrain/bbp-atlas-pipeline:$REGISTRY_IMAGE_TAG"
